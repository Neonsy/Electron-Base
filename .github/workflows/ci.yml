name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        name: Check and E2E
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out source
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - name: Set up Node.js and pnpm, then install from lockfile
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  cache: true
                  require-lockfile: true

            - name: Install E2E display server
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes xvfb

            - name: Run repository checks
              run: pnpm run check

            - name: Run Electron window test
              env:
                  UPDATER_ENABLED: '0'
              run: xvfb-run --auto-servernum pnpm exec playwright test

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

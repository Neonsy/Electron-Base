changelog:
    exclude:
        labels:
            - skip-changelog
    categories:
        - title: Security
          labels:
              - security
        - title: Breaking changes
          labels:
              - breaking-change
              - semver-major
        - title: Features
          labels:
              - enhancement
              - feature
              - semver-minor
        - title: Fixes
          labels:
              - bug
              - fix
              - semver-patch
        - title: Dependencies
          labels:
              - dependencies
        - title: Other changes
          labels:
              - '*'
